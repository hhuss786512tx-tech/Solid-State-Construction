    <!-- ====== PHONE-CALL CONVERSION TRACKING (delegated listener for all tel: links) ====== -->
    <script>
      document.addEventListener('click', function(e) {
        var a = e.target.closest && e.target.closest('a[href^="tel:"]');
        if (!a) return;
        if (typeof gtag === 'function') {
          gtag('event', 'conversion', {
            send_to: window.SSC_ADS && window.SSC_ADS.callLabel
              ? window.SSC_ADS.callLabel
              : 'AW-18245643754/YYYYYYYYYYYYYYYYYY'
          });
        }
      }, true);
    </script>

    <!-- ====== CONVERSION TRACKING HELPER (called by React after form submit + pushState to /thank-you) ====== -->
    <script>
      window.sscTrackConversion = function(type) {
        if (typeof gtag !== 'function') return;
        if (type === 'form' && window.SSC_ADS && window.SSC_ADS.formLabel) {
          gtag('event', 'conversion', { send_to: window.SSC_ADS.formLabel });
        }
        if (type === 'call' && window.SSC_ADS && window.SSC_ADS.callLabel) {
          gtag('event', 'conversion', { send_to: window.SSC_ADS.callLabel });
        }
        // Fire explicit page_view so destination-based conversion rules detect /thank-you
        gtag('event', 'page_view', {
          page_location: window.location.href,
          page_title: document.title
        });
      };
    </script>
